<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude VR — Main Street Magic</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    a-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

    #overlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      pointer-events: none;
    }
    #chat-box {
      pointer-events: all;
      width: min(580px, 96vw);
      background: rgba(8, 4, 18, 0.88);
      border: 1px solid rgba(212, 175, 55, 0.45);
      border-radius: 14px;
      backdrop-filter: blur(18px);
      padding: 14px;
      font-family: 'Lato', sans-serif;
      color: #f5e6c8;
      box-shadow: 0 0 40px rgba(212,175,55,0.12), 0 8px 32px rgba(0,0,0,0.7);
    }
    #chat-log {
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 10px;
      font-size: 13.5px;
      line-height: 1.65;
      scrollbar-width: thin;
      scrollbar-color: rgba(212,175,55,0.25) transparent;
    }
    .msg { margin-bottom: 8px; }
    .msg.user::before { content: "YOU  "; font-weight: 700; font-size: 10px; letter-spacing: 0.1em; color: #d4af37; }
    .msg.user { color: #f0d98a; }
    .msg.claude::before { content: "✦ CLAUDE  "; font-weight: 700; font-size: 10px; letter-spacing: 0.1em; color: #7ec8e3; }
    .msg.claude { color: #f5e6c8; }
    .msg.system { color: rgba(212,175,55,0.45); font-size: 11.5px; font-style: italic; text-align: center; margin-bottom: 6px; }
    #input-row { display: flex; gap: 7px; }
    #user-input {
      flex: 1;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212,175,55,0.28);
      border-radius: 9px;
      color: #f5e6c8;
      font-family: 'Lato', sans-serif;
      font-size: 13.5px;
      padding: 9px 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    #user-input:focus { border-color: rgba(212,175,55,0.65); }
    #user-input::placeholder { color: rgba(245,230,200,0.25); }
    .btn {
      background: linear-gradient(135deg, #c9a227, #8a6010);
      border: none; border-radius: 9px;
      color: #1a0f00;
      font-family: 'Cinzel', serif;
      font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em;
      padding: 9px 15px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:hover { opacity: 0.82; }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #mic-btn {
      background: rgba(126,200,227,0.12);
      border: 1px solid rgba(126,200,227,0.35);
      color: #7ec8e3;
    }
    #mic-btn.listening { background: rgba(126,200,227,0.28); border-color: #7ec8e3; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
    #controls-hint {
      font-family: 'Cinzel', serif;
      font-size: 10.5px;
      letter-spacing: 0.09em;
      color: rgba(212,175,55,0.38);
      text-align: center;
      margin-top: 9px;
    }
  </style>
</head>
<body>

<a-scene
  fog="type: exponential; color: #0c0818; density: 0.018"
  renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; logarithmicDepthBuffer: true"
  vr-mode-ui="enabled: true"
  loading-screen="backgroundColor: #050210; dotsColor: #d4af37"
>

  <!-- SKY -->
  <a-sky color="#080514"></a-sky>
  <!-- Horizon warm glow cylinders -->
  <a-cylinder position="0 -1 0" radius="55" height="6" color="#3a1a08" open-ended="true" side="back" opacity="0.55"></a-cylinder>
  <a-cylinder position="0 -0.5 0" radius="54" height="3" color="#7a3010" open-ended="true" side="back" opacity="0.25"></a-cylinder>

  <!-- LIGHTING -->
  <a-light type="ambient" color="#1a0a2e" intensity="0.9"></a-light>
  <a-light type="directional" color="#ffe0a0" intensity="0.5" position="2 8 4"></a-light>
  <a-light type="directional" color="#d4af37" intensity="0.35" position="0 6 -20"></a-light>
  <a-light type="directional" color="#2030a0" intensity="0.15" position="0 10 0"></a-light>

  <!-- GROUND -->
  <a-plane rotation="-90 0 0" width="80" height="80" color="#18121e" position="0 0 0"></a-plane>
  <!-- Street -->
  <a-plane rotation="-90 0 0" position="0 0.005 0" width="5.5" height="80" color="#1f1828" opacity="0.9"></a-plane>
  <!-- Gold center line -->
  <a-plane rotation="-90 0 0" position="0 0.01 0" width="0.07" height="60" color="#d4af37" opacity="0.2"></a-plane>
  <!-- Sidewalks -->
  <a-plane rotation="-90 0 0" position="-5.5 0.01 0" width="3" height="60" color="#231c30"></a-plane>
  <a-plane rotation="-90 0 0" position="5.5 0.01 0" width="3" height="60" color="#231c30"></a-plane>
  <!-- Curbs -->
  <a-box position="-4.05 0.06 0" width="0.12" height="0.12" depth="60" color="#2e2440"></a-box>
  <a-box position="4.05 0.06 0" width="0.12" height="0.12" depth="60" color="#2e2440"></a-box>

  <!-- LEFT BUILDINGS -->
  <!-- L1 -->
  <a-box position="-9 3 -2" width="6" height="6" depth="3" color="#2a1f38"></a-box>
  <a-box position="-9 6.5 -2" width="6" height="1.2" depth="3" color="#1e1628"></a-box>
  <a-plane position="-10.5 3.8 -0.49" width="1.1" height="1.4" color="#ffe0a0" opacity="0.6"></a-plane>
  <a-plane position="-9 3.8 -0.49" width="1.1" height="1.4" color="#ffc060" opacity="0.5"></a-plane>
  <a-plane position="-7.5 3.8 -0.49" width="1.1" height="1.4" color="#ffe0a0" opacity="0.55"></a-plane>
  <a-light type="point" color="#ffe4a0" intensity="0.4" position="-9 3.8 -0.3" distance="4" decay="2"></a-light>
  <a-box position="-9 0.8 -0.2" width="5.8" height="1.6" depth="0.5" color="#221838"></a-box>
  <a-box position="-9 1.85 -0.1" width="5.8" height="0.12" depth="1.4" color="#8b1a1a" rotation="-12 0 0"></a-box>

  <!-- L2 -->
  <a-box position="-9 4 -8" width="6" height="8" depth="3" color="#241b33"></a-box>
  <a-box position="-9 8.2 -8" width="6.3" height="0.9" depth="3.2" color="#1a1225"></a-box>
  <a-plane position="-11 5 -6.49" width="1" height="1.5" color="#ffe0a0" opacity="0.5"></a-plane>
  <a-plane position="-9 5 -6.49" width="1" height="1.5" color="#ffd070" opacity="0.45"></a-plane>
  <a-plane position="-7 5 -6.49" width="1" height="1.5" color="#ffe0a0" opacity="0.5"></a-plane>
  <a-light type="point" color="#ffe4a0" intensity="0.4" position="-9 5 -6" distance="4" decay="2"></a-light>
  <a-box position="-10.5 1.8 -6.7" width="0.12" height="3.6" depth="0.12" color="#3a2a10"></a-box>
  <a-box position="-7.5 1.8 -6.7" width="0.12" height="3.6" depth="0.12" color="#3a2a10"></a-box>

  <!-- L3 -->
  <a-box position="-9 3.5 -16" width="7" height="7" depth="3" color="#1e1628"></a-box>
  <a-box position="-9 7.2 -16" width="7.3" height="1" depth="3.2" color="#160f20"></a-box>
  <a-plane position="-11 4.5 -14.49" width="1.1" height="1.5" color="#ffe0a0" opacity="0.4"></a-plane>
  <a-plane position="-9 4.5 -14.49" width="1.1" height="1.5" color="#ffd070" opacity="0.35"></a-plane>
  <a-plane position="-7 4.5 -14.49" width="1.1" height="1.5" color="#ffe0a0" opacity="0.4"></a-plane>
  <a-light type="point" color="#ffd080" intensity="0.3" position="-9 4.5 -14" distance="5" decay="2"></a-light>

  <!-- RIGHT BUILDINGS -->
  <!-- R1 -->
  <a-box position="9 3.5 -2" width="6" height="7" depth="3" color="#28203a"></a-box>
  <a-box position="9 7.2 -2" width="6.3" height="0.9" depth="3.2" color="#1c1528"></a-box>
  <a-plane position="7.5 4 -0.49" width="1.1" height="1.5" color="#ffe0a0" opacity="0.6"></a-plane>
  <a-plane position="9 4 -0.49" width="1.1" height="1.5" color="#ffc060" opacity="0.55"></a-plane>
  <a-plane position="10.5 4 -0.49" width="1.1" height="1.5" color="#ffe0a0" opacity="0.6"></a-plane>
  <a-light type="point" color="#ffe4a0" intensity="0.4" position="9 4 -0.3" distance="4" decay="2"></a-light>
  <a-box position="9 0.8 -0.2" width="5.8" height="1.6" depth="0.5" color="#221838"></a-box>
  <a-box position="9 1.85 -0.1" width="5.8" height="0.12" depth="1.4" color="#1a5c2a" rotation="-12 0 0"></a-box>

  <!-- R2 -->
  <a-box position="9 5 -8" width="6" height="10" depth="3" color="#22183a"></a-box>
  <a-box position="9 10.2 -8" width="6.3" height="1" depth="3.2" color="#180f28"></a-box>
  <a-plane position="7.5 6 -6.49" width="1" height="1.5" color="#ffd070" opacity="0.5"></a-plane>
  <a-plane position="9 6 -6.49" width="1" height="1.5" color="#ffe0a0" opacity="0.55"></a-plane>
  <a-plane position="10.5 6 -6.49" width="1" height="1.5" color="#ffd070" opacity="0.5"></a-plane>
  <a-light type="point" color="#ffd080" intensity="0.45" position="9 6 -6" distance="5" decay="2"></a-light>
  <a-box position="10.5 11.5 -8" width="1.2" height="3" depth="1.2" color="#1a1030"></a-box>
  <a-cone position="10.5 13.5 -8" radius-bottom="0.8" radius-top="0.05" height="2.5" color="#8b0000"></a-cone>

  <!-- R3 -->
  <a-box position="9 4 -16" width="7" height="8" depth="3" color="#1e1530"></a-box>
  <a-box position="9 8.2 -16" width="7.3" height="1" depth="3.2" color="#140f22"></a-box>
  <a-plane position="7 5 -14.49" width="1.1" height="1.5" color="#ffe0a0" opacity="0.4"></a-plane>
  <a-plane position="9 5 -14.49" width="1.1" height="1.5" color="#ffd070" opacity="0.35"></a-plane>
  <a-plane position="11 5 -14.49" width="1.1" height="1.5" color="#ffe0a0" opacity="0.4"></a-plane>
  <a-light type="point" color="#ffd080" intensity="0.3" position="9 5 -14" distance="5" decay="2"></a-light>

  <!-- LAMP POSTS — left -->
  <a-entity position="-4.2 0 -3">
    <a-cylinder radius="0.07" height="3.5" color="#3a2a10" position="0 1.75 0"></a-cylinder>
    <a-box width="1.2" height="0.06" depth="0.06" color="#3a2a10" position="0.5 3.4 0"></a-box>
    <a-sphere radius="0.22" color="#fff8e1" position="1.1 3.4 0"></a-sphere>
    <a-light type="point" color="#ffe4a0" intensity="1.2" position="1.1 3.4 0" distance="9" decay="2"></a-light>
  </a-entity>
  <a-entity position="-4.2 0 -10">
    <a-cylinder radius="0.07" height="3.5" color="#3a2a10" position="0 1.75 0"></a-cylinder>
    <a-box width="1.2" height="0.06" depth="0.06" color="#3a2a10" position="0.5 3.4 0"></a-box>
    <a-sphere radius="0.22" color="#fff8e1" position="1.1 3.4 0"></a-sphere>
    <a-light type="point" color="#ffe4a0" intensity="1.0" position="1.1 3.4 0" distance="8" decay="2"></a-light>
  </a-entity>
  <a-entity position="-4.2 0 -17">
    <a-cylinder radius="0.07" height="3.5" color="#3a2a10" position="0 1.75 0"></a-cylinder>
    <a-box width="1.2" height="0.06" depth="0.06" color="#3a2a10" position="0.5 3.4 0"></a-box>
    <a-sphere radius="0.22" color="#fff8e1" position="1.1 3.4 0"></a-sphere>
    <a-light type="point" color="#ffe4a0" intensity="0.8" position="1.1 3.4 0" distance="7" decay="2"></a-light>
  </a-entity>

  <!-- LAMP POSTS — right -->
  <a-entity position="4.2 0 -3">
    <a-cylinder radius="0.07" height="3.5" color="#3a2a10" position="0 1.75 0"></a-cylinder>
    <a-box width="1.2" height="0.06" depth="0.06" color="#3a2a10" position="-0.5 3.4 0"></a-box>
    <a-sphere radius="0.22" color="#fff8e1" position="-1.1 3.4 0"></a-sphere>
    <a-light type="point" color="#ffe4a0" intensity="1.2" position="-1.1 3.4 0" distance="9" decay="2"></a-light>
  </a-entity>
  <a-entity position="4.2 0 -10">
    <a-cylinder radius="0.07" height="3.5" color="#3a2a10" position="0 1.75 0"></a-cylinder>
    <a-box width="1.2" height="0.06" depth="0.06" color="#3a2a10" position="-0.5 3.4 0"></a-box>
    <a-sphere radius="0.22" color="#fff8e1" position="-1.1 3.4 0"></a-sphere>
    <a-light type="point" color="#ffe4a0" intensity="1.0" position="-1.1 3.4 0" distance="8" decay="2"></a-light>
  </a-entity>
  <a-entity position="4.2 0 -17">
    <a-cylinder radius="0.07" height="3.5" color="#3a2a10" position="0 1.75 0"></a-cylinder>
    <a-box width="1.2" height="0.06" depth="0.06" color="#3a2a10" position="-0.5 3.4 0"></a-box>
    <a-sphere radius="0.22" color="#fff8e1" position="-1.1 3.4 0"></a-sphere>
    <a-light type="point" color="#ffe4a0" intensity="0.8" position="-1.1 3.4 0" distance="7" decay="2"></a-light>
  </a-entity>

  <!-- CASTLE -->
  <a-box position="0 1.5 -28" width="18" height="3" depth="2" color="#160e25"></a-box>
  <a-cylinder position="0 2.5 -27.1" radius="1.5" height="4" color="#0e0818" rotation="90 0 0"></a-cylinder>
  <a-box position="0 8 -28" width="3" height="13" depth="3" color="#130c22"></a-box>
  <a-cone position="0 15.5 -28" radius-bottom="1.8" radius-top="0.06" height="5" color="#1a0f35"></a-cone>
  <a-box position="-5 6 -28" width="2.2" height="9" depth="2.2" color="#110a1e"></a-box>
  <a-cone position="-5 11.5 -28" radius-bottom="1.3" radius-top="0.06" height="4.5" color="#160c2e"></a-cone>
  <a-box position="5 6 -28" width="2.2" height="9" depth="2.2" color="#110a1e"></a-box>
  <a-cone position="5 11.5 -28" radius-bottom="1.3" radius-top="0.06" height="4.5" color="#160c2e"></a-cone>
  <a-box position="-9 4.5 -28" width="1.6" height="6" depth="1.6" color="#0f0819"></a-box>
  <a-cone position="-9 8 -28" radius-bottom="0.95" radius-top="0.05" height="3.5" color="#130a22"></a-cone>
  <a-box position="9 4.5 -28" width="1.6" height="6" depth="1.6" color="#0f0819"></a-box>
  <a-cone position="9 8 -28" radius-bottom="0.95" radius-top="0.05" height="3.5" color="#130a22"></a-cone>
  <a-light type="point" color="#d4af37" intensity="2.5" position="0 2 -25" distance="18" decay="1.5"></a-light>
  <a-light type="point" color="#ff8030" intensity="1.2" position="-5 3 -25" distance="10" decay="2"></a-light>
  <a-light type="point" color="#ff8030" intensity="1.2" position="5 3 -25" distance="10" decay="2"></a-light>
  <a-light type="point" color="#7080ff" intensity="0.5" position="0 10 -28" distance="20" decay="2"></a-light>

  <!-- TWINKLING STARS -->
  <a-sphere position="15 18 -30" radius="0.08" color="#fff" opacity="0.8" animation="property:opacity;from:0.8;to:0.2;dur:2100;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-18 22 -35" radius="0.06" color="#d4af37" opacity="0.6" animation="property:opacity;from:0.6;to:0.1;dur:3200;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="8 25 -40" radius="0.07" color="#fff" opacity="0.7" animation="property:opacity;from:0.7;to:0.2;dur:1800;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-10 20 -45" radius="0.05" color="#7ec8e3" opacity="0.5" animation="property:opacity;from:0.5;to:0.1;dur:2600;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="20 16 -25" radius="0.07" color="#fff" opacity="0.6" animation="property:opacity;from:0.6;to:0.15;dur:2900;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-22 19 -28" radius="0.06" color="#d4af37" opacity="0.5" animation="property:opacity;from:0.5;to:0.1;dur:3500;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="3 28 -50" radius="0.08" color="#fff" opacity="0.65" animation="property:opacity;from:0.65;to:0.1;dur:2300;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="12 21 -38" radius="0.055" color="#ffc0e0" opacity="0.55" animation="property:opacity;from:0.55;to:0.1;dur:3800;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-14 24 -42" radius="0.06" color="#fff" opacity="0.6" animation="property:opacity;from:0.6;to:0.12;dur:2700;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="25 17 -33" radius="0.05" color="#d4af37" opacity="0.45" animation="property:opacity;from:0.45;to:0.08;dur:4100;dir:alternate;loop:true"></a-sphere>

  <!-- FIREFLY SPARKLES -->
  <a-sphere position="-2 1.8 -5" radius="0.04" color="#d4af37" opacity="0.8"
    animation__p="property:position;to:-2.3 2.4 -5.2;dur:3000;dir:alternate;loop:true;easing:easeInOutSine"
    animation__o="property:opacity;from:0.8;to:0.1;dur:2000;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="2.5 1.5 -7" radius="0.035" color="#7ec8e3" opacity="0.7"
    animation__p="property:position;to:2.2 2.2 -6.8;dur:3500;dir:alternate;loop:true;easing:easeInOutSine"
    animation__o="property:opacity;from:0.7;to:0.1;dur:2500;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-1.5 2.2 -12" radius="0.03" color="#fff0a0" opacity="0.6"
    animation__p="property:position;to:-1.8 2.8 -12;dur:2800;dir:alternate;loop:true;easing:easeInOutSine"
    animation__o="property:opacity;from:0.6;to:0.1;dur:3200;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="1 1.6 -4" radius="0.045" color="#ffa0c0" opacity="0.5"
    animation__p="property:position;to:1.4 2.3 -4.3;dur:4000;dir:alternate;loop:true;easing:easeInOutSine"
    animation__o="property:opacity;from:0.5;to:0.05;dur:2200;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-3 1.4 -9" radius="0.03" color="#d4af37" opacity="0.65"
    animation__p="property:position;to:-3.3 2.0 -9.2;dur:3200;dir:alternate;loop:true;easing:easeInOutSine"
    animation__o="property:opacity;from:0.65;to:0.1;dur:2800;dir:alternate;loop:true"></a-sphere>

  <!-- CLAUDE PANEL -->
  <a-entity id="claude-panel" position="0 1.6 -2.5">
    <a-plane width="2.5" height="1.8" color="#3040a0" opacity="0.06" position="0 0 -0.06"></a-plane>
    <a-plane width="2.2" height="1.5" color="#06030f" opacity="0.94"></a-plane>
    <a-plane width="2.24" height="1.54" color="#d4af37" opacity="0.22" position="0 0 -0.002"></a-plane>
    <a-plane width="2.2" height="0.27" color="#d4af37" opacity="0.1" position="0 0.615 0.002"></a-plane>
    <a-text value="✦  CLAUDE  ✦" color="#d4af37" align="center" width="2" position="0 0.615 0.012" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
    <a-text value="Main Street Magic" color="#7ec8e3" align="center" width="1.6" position="0 0.43 0.012" font="https://cdn.aframe.io/fonts/Exo2SemiBold.fnt"></a-text>
    <a-text id="vr-display" value="Welcome, traveler.&#10;Ask me anything below." color="#f5e6c8" align="left" width="1.95" position="-0.9 0.28 0.012" wrap-count="44" baseline="top"></a-text>
    <a-plane width="1.95" height="0.004" color="#d4af37" opacity="0.25" position="0 -0.43 0.01"></a-plane>
    <a-text id="vr-status" value="Use the chat panel below" color="#d4af37" align="center" width="1.8" opacity="0.45" position="0 -0.61 0.012" font="https://cdn.aframe.io/fonts/Exo2SemiBold.fnt"></a-text>
    <a-light type="point" color="#4060ff" intensity="0.3" position="0 0 0.5" distance="4" decay="2"></a-light>
  </a-entity>

  <!-- CAMERA RIG — WASD walkable, pointer-lock look -->
  <a-entity id="rig" position="0 0 1.5">
    <a-entity
      camera
      look-controls="pointerLockEnabled: true; magicWindowTrackingEnabled: true"
      wasd-controls="acceleration: 12; fly: false"
      position="0 1.6 0"
    ></a-entity>
  </a-entity>

</a-scene>

<!-- CHAT OVERLAY -->
<div id="overlay">
  <div id="chat-box">
    <div id="chat-log">
      <div class="msg system">✦ Welcome to Main Street Magic ✦</div>
      <div class="msg system">Click the scene to look around · WASD to walk · Ask Claude anything</div>
    </div>
    <div id="input-row">
      <input type="text" id="user-input" placeholder="Ask Claude something..." autocomplete="off" />
      <button class="btn" id="mic-btn" title="Voice input">🎙</button>
      <button class="btn" id="send-btn">Ask</button>
    </div>
  </div>
  <div id="controls-hint">WASD · WALK &nbsp;|&nbsp; CLICK &amp; DRAG · LOOK &nbsp;|&nbsp; QUEST 3 · TAP VR BUTTON</div>
</div>

<script>
const SYSTEM = `You are Claude, a warm AI assistant appearing as a glowing panel on a nighttime Disneyland-inspired Main Street in VR. Be helpful and conversational. Keep responses concise — 2-4 sentences is ideal since the user may be in VR. Bring warmth and a touch of magic, but keep it natural. Answer any question.`;

const history = [];

async function askClaude(msg) {
  history.push({ role: "user", content: msg });
  const res = await fetch("https://restless-glade-a1e4.andpcooke.workers.dev", {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
  },
  body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      system: SYSTEM,
      messages: history
    })
  });
  const data = await res.json();
  const reply = data.content?.find(b => b.type === "text")?.text || "The magic seems to be resting — try again?";
  history.push({ role: "assistant", content: reply });
  if (history.length > 20) history.splice(0, 2);
  return reply;
}

function wrap(text, max = 44) {
  const words = text.split(' ');
  let lines = [], cur = '';
  for (const w of words) {
    if ((cur + w).length > max) { lines.push(cur.trimEnd()); cur = ''; }
    cur += w + ' ';
  }
  if (cur.trim()) lines.push(cur.trimEnd());
  return lines.slice(0, 7).join('\n');
}

function setVRDisplay(user, claude) {
  const el = document.getElementById('vr-display');
  const st = document.getElementById('vr-status');
  if (el) el.setAttribute('value', `You: ${wrap(user, 40)}\n\nClaude: ${wrap(claude, 40)}`);
  if (st) st.setAttribute('value', '');
}

function addMsg(role, text) {
  const log = document.getElementById('chat-log');
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function setLoading(on) {
  document.getElementById('send-btn').disabled = on;
  document.getElementById('send-btn').textContent = on ? '...' : 'Ask';
  document.getElementById('mic-btn').disabled = on;
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  document.getElementById('user-input').value = '';
  addMsg('user', text);
  setLoading(true);
  const d = document.getElementById('vr-display');
  const st = document.getElementById('vr-status');
  if (d) d.setAttribute('value', `You: ${wrap(text, 40)}\n\nClaude: ✦ thinking...`);
  if (st) st.setAttribute('value', '');
  try {
    const reply = await askClaude(text);
    addMsg('claude', reply);
    setVRDisplay(text, reply);
  } catch (e) {
    addMsg('system', 'Something went wrong — try again.');
    if (st) st.setAttribute('value', 'Something went wrong.');
  }
  setLoading(false);
}

document.getElementById('send-btn').addEventListener('click', () => send(document.getElementById('user-input').value));
document.getElementById('user-input').addEventListener('keydown', e => { if (e.key === 'Enter') send(e.target.value); });

// Voice
const micBtn = document.getElementById('mic-btn');
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false;
  rec.onstart = () => { micBtn.classList.add('listening'); micBtn.textContent = '⏹'; };
  rec.onend = () => { micBtn.classList.remove('listening'); micBtn.textContent = '🎙'; };
  rec.onresult = e => { const t = e.results[0][0].transcript; document.getElementById('user-input').value = t; send(t); };
  micBtn.addEventListener('click', () => {
    if (micBtn.classList.contains('listening')) rec.stop();
    else try { rec.start(); } catch(e) {}
  });
} else {
  micBtn.style.opacity = '0.3';
}

// Hide overlay in VR
const scene = document.querySelector('a-scene');
scene.addEventListener('enter-vr', () => { document.getElementById('overlay').style.display = 'none'; });
scene.addEventListener('exit-vr', () => { document.getElementById('overlay').style.display = 'flex'; });
</script>

</body>
</html>
