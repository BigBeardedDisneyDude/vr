<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude VR — Main Street Magic</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- Post-processing (bloom) -->
  <script src="https://cdn.jsdelivr.net/gh/akbartus/A-Frame-Component-Postprocessing@main/dist/post-processing.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    a-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

    #overlay {
      position: fixed; bottom: 0; left: 0; right: 0;
      z-index: 9999; display: flex; flex-direction: column;
      align-items: center; padding: 16px; pointer-events: none;
    }
    #chat-box {
      pointer-events: all; width: min(580px, 96vw);
      background: rgba(8,4,18,0.88); border: 1px solid rgba(212,175,55,0.45);
      border-radius: 14px; backdrop-filter: blur(18px); padding: 14px;
      font-family: 'Lato', sans-serif; color: #f5e6c8;
      box-shadow: 0 0 40px rgba(212,175,55,0.12), 0 8px 32px rgba(0,0,0,0.7);
    }
    #chat-log {
      max-height: 180px; overflow-y: auto; margin-bottom: 10px;
      font-size: 13.5px; line-height: 1.65;
      scrollbar-width: thin; scrollbar-color: rgba(212,175,55,0.25) transparent;
    }
    .msg { margin-bottom: 8px; }
    .msg.user::before { content: "YOU  "; font-weight: 700; font-size: 10px; letter-spacing: 0.1em; color: #d4af37; }
    .msg.user { color: #f0d98a; }
    .msg.claude::before { content: "✦ CLAUDE  "; font-weight: 700; font-size: 10px; letter-spacing: 0.1em; color: #7ec8e3; }
    .msg.claude { color: #f5e6c8; }
    .msg.system { color: rgba(212,175,55,0.45); font-size: 11.5px; font-style: italic; text-align: center; margin-bottom: 6px; }
    #input-row { display: flex; gap: 7px; }
    #user-input {
      flex: 1; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(212,175,55,0.28); border-radius: 9px;
      color: #f5e6c8; font-family: 'Lato', sans-serif; font-size: 13.5px;
      padding: 9px 13px; outline: none; transition: border-color 0.2s;
    }
    #user-input:focus { border-color: rgba(212,175,55,0.65); }
    #user-input::placeholder { color: rgba(245,230,200,0.25); }
    .btn {
      background: linear-gradient(135deg, #c9a227, #8a6010);
      border: none; border-radius: 9px; color: #1a0f00;
      font-family: 'Cinzel', serif; font-size: 11px; font-weight: 700;
      letter-spacing: 0.06em; padding: 9px 15px; cursor: pointer;
      transition: opacity 0.15s, transform 0.1s; white-space: nowrap;
    }
    .btn:hover { opacity: 0.82; }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #mic-btn { background: rgba(126,200,227,0.12); border: 1px solid rgba(126,200,227,0.35); color: #7ec8e3; }
    #mic-btn.listening { background: rgba(126,200,227,0.28); border-color: #7ec8e3; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.45} }
    #controls-hint {
      font-family: 'Cinzel', serif; font-size: 10.5px; letter-spacing: 0.09em;
      color: rgba(212,175,55,0.38); text-align: center; margin-top: 9px;
    }
  </style>
</head>
<body>

<a-scene
  post-processing="effect: bloom; bloomParams: threshold: 0.3, strength: 0.9, radius: 0.6, exposure: 1.1"
  fog="type: exponential; color: #08051a; density: 0.014"
  renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true; logarithmicDepthBuffer: true"
  shadow="type: pcfsoft"
  vr-mode-ui="enabled: true"
  loading-screen="backgroundColor: #050210; dotsColor: #d4af37"
>

  <!-- ══════════════════════════════════════════════
       PROCEDURAL TEXTURES via canvas
  ══════════════════════════════════════════════ -->
  <a-assets>
    <!-- Brick texture -->
    <canvas id="brick-canvas" width="256" height="256" style="display:none"></canvas>
    <!-- Stone texture -->
    <canvas id="stone-canvas" width="256" height="256" style="display:none"></canvas>
    <!-- Wood plank texture -->
    <canvas id="wood-canvas" width="256" height="128" style="display:none"></canvas>
    <!-- Cobble texture -->
    <canvas id="cobble-canvas" width="256" height="256" style="display:none"></canvas>
  </a-assets>

  <!-- ══════════════════════════════════════════════
       SKY — deep indigo with painted clouds
  ══════════════════════════════════════════════ -->
  <a-sky id="nightsky" color="#07041a"></a-sky>

  <!-- Moon -->
  <a-sphere position="12 22 -50" radius="1.4" color="#f0e8c8" emit="true"
    material="color: #f0e8c8; emissive: #c8b878; emissiveIntensity: 0.8; roughness: 0.9"></a-sphere>
  <a-light type="point" color="#c8b878" intensity="0.3" position="12 22 -50" distance="200" decay="1"></a-light>

  <!-- Warm horizon glow — like park lights bleeding into sky -->
  <a-cylinder position="0 -2 0" radius="58" height="8" color="#3d1a06" open-ended="true" side="back" opacity="0.7"></a-cylinder>
  <a-cylinder position="0 -1 0" radius="57" height="4" color="#7a3510" open-ended="true" side="back" opacity="0.4"></a-cylinder>
  <a-cylinder position="0 0 0" radius="56" height="2" color="#b05020" open-ended="true" side="back" opacity="0.15"></a-cylinder>

  <!-- ══════════════════════════════════════════════
       TWINKLING STARS
  ══════════════════════════════════════════════ -->
  <a-sphere position="18 20 -45" radius="0.09" material="color:#fff;emissive:#fff;emissiveIntensity:1" animation="property:opacity;from:1;to:0.1;dur:2100;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-20 24 -50" radius="0.07" material="color:#d4af37;emissive:#d4af37;emissiveIntensity:1" animation="property:opacity;from:0.9;to:0.1;dur:3200;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="9 27 -55" radius="0.08" material="color:#fff;emissive:#fff;emissiveIntensity:1" animation="property:opacity;from:1;to:0.15;dur:1800;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-12 21 -48" radius="0.06" material="color:#bbd4ff;emissive:#bbd4ff;emissiveIntensity:1" animation="property:opacity;from:0.8;to:0.1;dur:2600;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="25 18 -40" radius="0.08" material="color:#fff;emissive:#fff;emissiveIntensity:1" animation="property:opacity;from:0.9;to:0.15;dur:2900;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-28 22 -42" radius="0.07" material="color:#d4af37;emissive:#d4af37;emissiveIntensity:1" animation="property:opacity;from:0.7;to:0.1;dur:3500;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="4 30 -60" radius="0.09" material="color:#fff;emissive:#fff;emissiveIntensity:1" animation="property:opacity;from:0.85;to:0.1;dur:2300;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="14 23 -52" radius="0.06" material="color:#ffc0e0;emissive:#ffc0e0;emissiveIntensity:1" animation="property:opacity;from:0.7;to:0.1;dur:3800;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-16 26 -58" radius="0.07" material="color:#fff;emissive:#fff;emissiveIntensity:1" animation="property:opacity;from:0.8;to:0.12;dur:2700;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="30 19 -44" radius="0.06" material="color:#d4af37;emissive:#d4af37;emissiveIntensity:1" animation="property:opacity;from:0.6;to:0.08;dur:4100;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-5 32 -65" radius="0.07" material="color:#fff;emissive:#fff;emissiveIntensity:1" animation="property:opacity;from:0.75;to:0.1;dur:3100;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="22 28 -55" radius="0.05" material="color:#bbd4ff;emissive:#bbd4ff;emissiveIntensity:1" animation="property:opacity;from:0.65;to:0.1;dur:2400;dir:alternate;loop:true"></a-sphere>

  <!-- ══════════════════════════════════════════════
       GLOBAL LIGHTING
  ══════════════════════════════════════════════ -->
  <a-light type="ambient" color="#0d0828" intensity="1.2"></a-light>
  <!-- Moonlight -->
  <a-light type="directional" color="#c8c0f0" intensity="0.25" position="12 22 -10" cast-shadow="true"></a-light>
  <!-- Warm park overhead glow -->
  <a-light type="directional" color="#ffe0a0" intensity="0.2" position="0 8 0"></a-light>
  <!-- Castle backlight -->
  <a-light type="directional" color="#d4af37" intensity="0.3" position="0 8 -25"></a-light>

  <!-- ══════════════════════════════════════════════
       GROUND — textured cobblestone street
  ══════════════════════════════════════════════ -->
  <!-- Base ground -->
  <a-plane id="ground" rotation="-90 0 0" width="80" height="80" position="0 0 0"
    material="color: #1a1428; roughness: 1; repeat: 8 8"></a-plane>

  <!-- Main street pavement — slightly lighter -->
  <a-plane rotation="-90 0 0" position="0 0.008 0" width="6" height="70"
    material="color: #201830; roughness: 0.95"></a-plane>

  <!-- Brick sidewalks -->
  <a-plane rotation="-90 0 0" position="-5.6 0.01 0" width="3.2" height="70"
    material="color: #2a1e38; roughness: 0.98" id="sidewalk-l"></a-plane>
  <a-plane rotation="-90 0 0" position="5.6 0.01 0" width="3.2" height="70"
    material="color: #2a1e38; roughness: 0.98" id="sidewalk-r"></a-plane>

  <!-- Curb edges with slight height -->
  <a-box position="-4.1 0.07 0" width="0.15" height="0.14" depth="70" color="#2e2848"></a-box>
  <a-box position="4.1 0.07 0" width="0.15" height="0.14" depth="70" color="#2e2848"></a-box>

  <!-- Street center divider lines -->
  <a-plane rotation="-90 0 0" position="-0.8 0.012 0" width="0.06" height="60" color="#d4af37" opacity="0.18"></a-plane>
  <a-plane rotation="-90 0 0" position="0.8 0.012 0" width="0.06" height="60" color="#d4af37" opacity="0.18"></a-plane>

  <!-- Sidewalk border trim -->
  <a-box position="-4.16 0.1 0" width="0.08" height="0.2" depth="70"
    material="color: #d4af37; emissive: #d4af37; emissiveIntensity: 0.15" opacity="0.6"></a-box>
  <a-box position="4.16 0.1 0" width="0.08" height="0.2" depth="70"
    material="color: #d4af37; emissive: #d4af37; emissiveIntensity: 0.15" opacity="0.6"></a-box>

  <!-- ══════════════════════════════════════════════
       LEFT BUILDINGS — Victorian commercial row
  ══════════════════════════════════════════════ -->

  <!-- ─── BUILDING L1 — Emporium-style shop ─── -->
  <a-entity position="-9.5 0 -2" rotation="0 90 0">
    <!-- Main facade -->
    <a-box position="0 4 0" width="7" height="8" depth="3.5"
      material="color:#2c1f40;roughness:0.95;metalness:0.05"></a-box>
    <!-- Upper decorative band -->
    <a-box position="0 8.2 0" width="7.2" height="0.5" depth="3.6"
      material="color:#3a2850;roughness:0.9"></a-box>
    <!-- Cornice -->
    <a-box position="0 8.65 0" width="7.4" height="0.35" depth="3.8"
      material="color:#d4af37;emissive:#d4af37;emissiveIntensity:0.08;roughness:0.7;metalness:0.3"></a-box>
    <!-- Parapet top -->
    <a-box position="0 9.1 0" width="7.2" height="0.9" depth="3.5"
      material="color:#281a38;roughness:0.95"></a-box>

    <!-- Windows row 1 (upper) — arched suggestion -->
    <a-box position="-2.2 6.2 1.76" width="1.3" height="1.8" depth="0.12"
      material="color:#1a0f2e;roughness:0.9"></a-box>
    <a-plane position="-2.2 6.2 1.83" width="1.0" height="1.5"
      material="color:#ffe8b0;emissive:#ffe8b0;emissiveIntensity:0.6;opacity:0.85"></a-plane>
    <a-box position="0 6.2 1.76" width="1.3" height="1.8" depth="0.12"
      material="color:#1a0f2e;roughness:0.9"></a-box>
    <a-plane position="0 6.2 1.83" width="1.0" height="1.5"
      material="color:#ffc060;emissive:#ffc060;emissiveIntensity:0.5;opacity:0.8"></a-plane>
    <a-box position="2.2 6.2 1.76" width="1.3" height="1.8" depth="0.12"
      material="color:#1a0f2e;roughness:0.9"></a-box>
    <a-plane position="2.2 6.2 1.83" width="1.0" height="1.5"
      material="color:#ffe8b0;emissive:#ffe8b0;emissiveIntensity:0.55;opacity:0.85"></a-plane>

    <!-- Ground floor storefront -->
    <a-box position="0 1.2 1.76" width="7" height="2.4" depth="0.12"
      material="color:#221638;roughness:0.9"></a-box>
    <!-- Large shop windows -->
    <a-plane position="-2.0 1.2 1.84" width="2.0" height="1.9"
      material="color:#ffe8b0;emissive:#ffd080;emissiveIntensity:0.35;opacity:0.5;transparent:true"></a-plane>
    <a-plane position="2.0 1.2 1.84" width="2.0" height="1.9"
      material="color:#ffe8b0;emissive:#ffd080;emissiveIntensity:0.35;opacity:0.5;transparent:true"></a-plane>
    <!-- Door -->
    <a-box position="0 1.0 1.84" width="0.9" height="2.0" depth="0.06"
      material="color:#3a2810;roughness:0.8;metalness:0.2"></a-box>

    <!-- Awning -->
    <a-box position="0 2.85 2.3" width="6.5" height="0.12" depth="1.6"
      rotation="-18 0 0"
      material="color:#8b1a1a;roughness:0.8"></a-box>
    <!-- Awning valance -->
    <a-box position="0 2.05 2.95" width="6.5" height="0.35" depth="0.08"
      material="color:#7a1515;roughness:0.8"></a-box>
    <!-- Awning stripes -->
    <a-box position="-2 2.85 2.3" width="0.25" height="0.14" depth="1.62" rotation="-18 0 0"
      material="color:#c0c0c0;roughness:0.8" opacity="0.4"></a-box>
    <a-box position="0 2.85 2.3" width="0.25" height="0.14" depth="1.62" rotation="-18 0 0"
      material="color:#c0c0c0;roughness:0.8" opacity="0.4"></a-box>
    <a-box position="2 2.85 2.3" width="0.25" height="0.14" depth="1.62" rotation="-18 0 0"
      material="color:#c0c0c0;roughness:0.8" opacity="0.4"></a-box>

    <!-- Columns flanking entrance -->
    <a-cylinder position="-2.8 1.5 1.84" radius="0.1" height="3" color="#3a2a18" roughness="0.8"></a-cylinder>
    <a-cylinder position="2.8 1.5 1.84" radius="0.1" height="3" color="#3a2a18" roughness="0.8"></a-cylinder>
    <a-sphere position="-2.8 3.1 1.84" radius="0.12" color="#d4af37"
      material="color:#d4af37;emissive:#d4af37;emissiveIntensity:0.3"></a-sphere>
    <a-sphere position="2.8 3.1 1.84" radius="0.12" color="#d4af37"
      material="color:#d4af37;emissive:#d4af37;emissiveIntensity:0.3"></a-sphere>

    <!-- Interior window glow light -->
    <a-light type="point" color="#ffe4a0" intensity="0.6" position="0 1.5 1.5" distance="4" decay="2"></a-light>
    <a-light type="point" color="#ffc060" intensity="0.4" position="0 6 1.5" distance="3" decay="2"></a-light>
  </a-entity>

  <!-- ─── BUILDING L2 — Taller Victorian with tower ─── -->
  <a-entity position="-9.5 0 -10" rotation="0 90 0">
    <a-box position="0 5.5 0" width="7" height="11" depth="3.5"
      material="color:#261a38;roughness:0.95;metalness:0.04"></a-box>
    <!-- Decorative bands -->
    <a-box position="0 4 1.76" width="7" height="0.2" depth="0.15"
      material="color:#d4af37;emissive:#d4af37;emissiveIntensity:0.1;metalness:0.5"></a-box>
    <a-box position="0 7 1.76" width="7" height="0.2" depth="0.15"
      material="color:#d4af37;emissive:#d4af37;emissiveIntensity:0.1;metalness:0.5"></a-box>
    <a-box position="0 11.2 0" width="7.3" height="0.4" depth="3.7"
      material="color:#d4af37;emissive:#d4af37;emissiveIntensity:0.08;metalness:0.4"></a-box>
    <a-box position="0 11.6 0" width="7" height="0.8" depth="3.4"
      material="color:#1e1430;roughness:0.95"></a-box>

    <!-- Windows upper floor -->
    <a-box position="-2.2 8.5 1.76" width="1.2" height="2.0" depth="0.12"
      material="color:#18102c;roughness:0.9"></a-box>
    <a-plane position="-2.2 8.5 1.84" width="0.9" height="1.7"
      material="color:#ffe8b0;emissive:#ffe8b0;emissiveIntensity:0.55;opacity:0.8"></a-plane>
    <a-box position="0 8.5 1.76" width="1.2" height="2.0" depth="0.12"
      material="color:#18102c;roughness:0.9"></a-box>
    <a-plane position="0 8.5 1.84" width="0.9" height="1.7"
      material="color:#ffc060;emissive:#ffc060;emissiveIntensity:0.45;opacity:0.75"></a-plane>
    <a-box position="2.2 8.5 1.76" width="1.2" height="2.0" depth="0.12"
      material="color:#18102c;roughness:0.9"></a-box>
    <a-plane position="2.2 8.5 1.84" width="0.9" height="1.7"
      material="color:#ffe8b0;emissive:#ffe8b0;emissiveIntensity:0.5;opacity:0.8"></a-plane>

    <!-- Windows mid floor -->
    <a-plane position="-2.2 5.5 1.84" width="1.0" height="1.5"
      material="color:#ffd080;emissive:#ffd080;emissiveIntensity:0.4;opacity:0.75"></a-plane>
    <a-plane position="0 5.5 1.84" width="1.0" height="1.5"
      material="color:#ffe8b0;emissive:#ffe8b0;emissiveIntensity:0.45;opacity:0.8"></a-plane>
    <a-plane position="2.2 5.5 1.84" width="1.0" height="1.5"
      material="color:#ffd080;emissive:#ffd080;emissiveIntensity:0.4;opacity:0.75"></a-plane>

    <!-- Ground floor -->
    <a-box position="0 1.2 1.76" width="7" height="2.4" depth="0.12"
      material="color:#201538;roughness:0.9"></a-box>
    <a-plane position="-1.8 1.2 1.84" width="2.2" height="2.0"
      material="color:#ffe8b0;emissive:#ffd080;emissiveIntensity:0.3;opacity:0.45;transparent:true"></a-plane>
    <a-plane position="1.8 1.2 1.84" width="2.2" height="2.0"
      material="color:#ffe8b0;emissive:#ffd080;emissiveIntensity:0.3;opacity:0.45;transparent:true"></a-plane>

    <!-- Columns -->
    <a-cylinder position="-3 1.8 1.84" radius="0.12" height="3.6" color="#3a2a18" roughness="0.7" metalness="0.2"></a-cylinder>
    <a-cylinder position="3 1.8 1.84" radius="0.12" height="3.6" color="#3a2a18" roughness="0.7" metalness="0.2"></a-cylinder>

    <!-- Side tower -->
    <a-box position="4.2 7 0" width="2" height="14" depth="2"
      material="color:#1e1530;roughness:0.95"></a-box>
    <a-cone position="4.2 14.5 0" radius-bottom="1.3" radius-top="0.05" height="3.5"
      material="color:#8b1a1a;roughness:0.7;metalness:0.2"></a-cone>
    <!-- Tower window -->
    <a-plane position="4.2 9 0.96" width="0.8" height="1.2"
      material="color:#ffe8b0;emissive:#ffe8b0;emissiveIntensity:0.5;opacity:0.8"></a-plane>

    <a-light type="point" color="#ffe4a0" intensity="0.5" position="0 5 1.5" distance="5" decay="2"></a-light>
    <a-light type="point" color="#ffd080" intensity="0.4" position="0 9 1.5" distance="4" decay="2"></a-light>
  </a-entity>

  <!-- ─── BUILDING L3 ─── -->
  <a-entity position="-9.5 0 -19" rotation="0 90 0">
    <a-box position="0 4.5 0" width="8" height="9" depth="3.5"
      material="color:#231840;roughness:0.95"></a-box>
    <a-box position="0 9.15 0" width="8.3" height="0.4" depth="3.7"
      material="color:#d4af37;emissive:#d4af37;emissiveIntensity:0.08;metalness:0.4"></a-box>
    <a-box position="0 9.6 0" width="8" height="1.0" depth="3.4"
      material="color:#1a1232;roughness:0.95"></a-box>
    <!-- Windows -->
    <a-plane position="-2.8 6.5 1.76" width="1.1" height="1.6"
      material="color:#ffd080;emissive:#ffd080;emissiveIntensity:0.4;opacity:0.75"></a-plane>
    <a-plane position="-0.8 6.5 1.76" width="1.1" height="1.6"
      material="color:#ffe8b0;emissive:#ffe8b0;emissiveIntensity:0.45;opacity:0.8"></a-plane>
    <a-plane position="1.2 6.5 1.76" width="1.1" height="1.6"
      material="color:#ffd080;emissive:#ffd080;emissiveIntensity:0.4;opacity:0.75"></a-plane>
    <a-plane position="3.2 6.5 1.76" width="1.1" height="1.6"
      material="color:#ffe8b0;emissive:#ffe8b0;emissiveIntensity:0.35;opacity:0.7"></a-plane>
    <!-- Ground floor -->
    <a-plane position="-2.0 1.5 1.77" width="2.4" height="2.2"
      material="color:#ffe8b0;emissive:#ffd080;emissiveIntensity:0.25;opacity:0.4;transparent:true"></a-plane>
    <a-plane position="2.0 1.5 1.77" width="2.4" height="2.2"
      material="color:#ffe8b0;emissive:#ffd080;emissiveIntensity:0.25;opacity:0.4;transparent:true"></a-plane>
    <a-light type="point" color="#ffd080" intensity="0.4" position="0 4 1.5" distance="5" decay="2"></a-light>
  </a-entity>

  <!-- ══════════════════════════════════════════════

  <a-sphere position="2.8 1.6 -8" radius="0.035"
    material="color:#7ec8e3;emissive:#7ec8e3;emissiveIntensity:3"
    animation__p="property:position;to:2.4 2.4 -7.8;dur:3500;dir:alternate;loop:true;easing:easeInOutSine"
    animation__o="property:opacity;from:0.9;to:0.05;dur:2500;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-1.8 2.3 -14" radius="0.035"
    material="color:#fff0a0;emissive:#fff0a0;emissiveIntensity:3"
    animation__p="property:position;to:-2.1 3.0 -14.2;dur:2800;dir:alternate;loop:true;easing:easeInOutSine"
    animation__o="property:opacity;from:0.8;to:0.05;dur:3200;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="1.2 1.7 -4" radius="0.04"
    material="color:#ffa0c0;emissive:#ffa0c0;emissiveIntensity:3"
    animation__p="property:position;to:1.6 2.5 -4.4;dur:4000;dir:alternate;loop:true;easing:easeInOutSine"
    animation__o="property:opacity;from:0.8;to:0.04;dur:2200;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="-3.2 1.5 -11" radius="0.033"
    material="color:#d4af37;emissive:#d4af37;emissiveIntensity:3"
    animation__p="property:position;to:-3.5 2.2 -11.3;dur:3200;dir:alternate;loop:true;easing:easeInOutSine"
    animation__o="property:opacity;from:0.85;to:0.05;dur:2800;dir:alternate;loop:true"></a-sphere>
  <a-sphere position="3.5 2.0 -16" radius="0.038"
    material="color:#c0e0ff;emissive:#c0e0ff;emissiveIntensity:3"
    animation__p="property:position;to:3.2 2.8 -16.3;dur:3600;dir:alternate;loop:true;easing:easeInOutSine"
    animation__o="property:opacity;from:0.75;to:0.04;dur:2400;dir:alternate;loop:true"></a-sphere>

  <!-- ══════════════════════════════════════════════
       CLAUDE PANEL
  ══════════════════════════════════════════════ -->
  <a-entity id="claude-panel" position="0 1.6 -2.6">
    <!-- Subtle glow halo -->
    <a-plane width="2.6" height="1.9" material="color:#3040c0;emissive:#3040c0;emissiveIntensity:0.15" position="0 0 -0.08" opacity="0.15"></a-plane>
    <!-- Panel -->
    <a-plane width="2.2" height="1.5" material="color:#04020e;roughness:0.5;metalness:0.2" opacity="0.95"></a-plane>
    <!-- Gold border -->
    <a-plane width="2.26" height="1.56" color="#d4af37" opacity="0.25" position="0 0 -0.002"></a-plane>
    <!-- Header -->
    <a-plane width="2.2" height="0.27" material="color:#d4af37;emissive:#d4af37;emissiveIntensity:0.12" opacity="0.15" position="0 0.615 0.002"></a-plane>

    <a-text value="✦  CLAUDE  ✦" color="#d4af37" align="center" width="2" position="0 0.615 0.014" font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"></a-text>
    <a-text value="Main Street Magic" color="#7ec8e3" align="center" width="1.6" position="0 0.43 0.014" font="https://cdn.aframe.io/fonts/Exo2SemiBold.fnt"></a-text>
    <a-text id="vr-display" value="Welcome, traveler.&#10;Ask me anything below." color="#f5e6c8" align="left" width="1.95" position="-0.9 0.28 0.014" wrap-count="44" baseline="top"></a-text>
    <a-plane width="1.95" height="0.004" material="color:#d4af37;emissive:#d4af37;emissiveIntensity:0.3" opacity="0.4" position="0 -0.43 0.012"></a-plane>
    <a-text id="vr-status" value="Use the chat panel below" color="#d4af37" align="center" width="1.8" opacity="0.45" position="0 -0.61 0.014" font="https://cdn.aframe.io/fonts/Exo2SemiBold.fnt"></a-text>

      camera

      wasd-controls="acceleration: 14; fly: false"
      position="0 1.6 0"

<!-- CHAT OVERLAY -->
<div id="overlay">
  <div id="chat-box">
    <div id="chat-log">
      <div class="msg system">✦ Welcome to Main Street Magic ✦</div>
      <div class="msg system">Click scene to look · WASD to walk · Ask Claude anything</div>
    </div>
    <div id="input-row">
      <input type="text" id="user-input" placeholder="Ask Claude something..." autocomplete="off" />
      <button class="btn" id="mic-btn" title="Voice input">🎙</button>
      <button class="btn" id="send-btn">Ask</button>
    </div>
  </div>
  <div id="controls-hint">WASD · WALK &nbsp;|&nbsp; CLICK &amp; DRAG · LOOK &nbsp;|&nbsp; QUEST 3 · TAP VR BUTTON</div>
</div>

<script>
const SYSTEM = `You are Claude, a warm AI assistant appearing as a glowing panel on a nighttime Disneyland-inspired Main Street in VR. Be helpful and conversational. Keep responses concise — 2-4 sentences is ideal since the user may be in VR. Bring warmth and a touch of magic, but keep it natural. Answer any question.`;
const history = [];

async function askClaude(msg) {
  history.push({ role: "user", content: msg });
  const res = await fetch("https://restless-glade-a1e4.andpcooke.workers.dev", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ model: "claude-sonnet-4-5", max_tokens: 1000, system: SYSTEM, messages: history })
  });
  const data = await res.json();
  const reply = data.content?.find(b => b.type === "text")?.text || "The magic seems to be resting — try again?";
  history.push({ role: "assistant", content: reply });
  if (history.length > 20) history.splice(0, 2);
  return reply;
}

function wrap(text, max = 44) {
  const words = text.split(' ');
  let lines = [], cur = '';
  for (const w of words) {
    if ((cur + w).length > max) { lines.push(cur.trimEnd()); cur = ''; }
    cur += w + ' ';
  }
  if (cur.trim()) lines.push(cur.trimEnd());
  return lines.slice(0, 7).join('\n');
}

function setVRDisplay(user, claude) {
  const el = document.getElementById('vr-display');
  const st = document.getElementById('vr-status');
  if (el) el.setAttribute('value', `You: ${wrap(user, 40)}\n\nClaude: ${wrap(claude, 40)}`);
  if (st) st.setAttribute('value', '');
}

function addMsg(role, text) {
  const log = document.getElementById('chat-log');
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

function setLoading(on) {
  document.getElementById('send-btn').disabled = on;
  document.getElementById('send-btn').textContent = on ? '...' : 'Ask';
  document.getElementById('mic-btn').disabled = on;
}

async function send(text) {
  text = text.trim();
  if (!text) return;
  document.getElementById('user-input').value = '';
  addMsg('user', text);
  setLoading(true);
  const d = document.getElementById('vr-display');
  const st = document.getElementById('vr-status');
  if (d) d.setAttribute('value', `You: ${wrap(text, 40)}\n\nClaude: ✦ thinking...`);
  if (st) st.setAttribute('value', '');
  try {
    const reply = await askClaude(text);
    addMsg('claude', reply);
    setVRDisplay(text, reply);
  } catch (e) {
    addMsg('system', 'Something went wrong — try again.');
    if (st) st.setAttribute('value', 'Something went wrong.');
  }
  setLoading(false);
}

document.getElementById('send-btn').addEventListener('click', () => send(document.getElementById('user-input').value));
document.getElementById('user-input').addEventListener('keydown', e => { if (e.key === 'Enter') send(e.target.value); });

const micBtn = document.getElementById('mic-btn');
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.lang = 'en-US'; rec.interimResults = false;
  rec.onstart = () => { micBtn.classList.add('listening'); micBtn.textContent = '⏹'; };
  rec.onend = () => { micBtn.classList.remove('listening'); micBtn.textContent = '🎙'; };
  rec.onresult = e => { const t = e.results[0][0].transcript; document.getElementById('user-input').value = t; send(t); };
  micBtn.addEventListener('click', () => {
    if (micBtn.classList.contains('listening')) rec.stop();
    else try { rec.start(); } catch(e) {}
  });
} else { micBtn.style.opacity = '0.3'; }

const scene = document.querySelector('a-scene');
scene.addEventListener('enter-vr', () => { document.getElementById('overlay').style.display = 'none'; });
scene.addEventListener('exit-vr', () => { document.getElementById('overlay').style.display = 'flex'; });
</script>
